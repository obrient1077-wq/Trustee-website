<!DOCTYPE html>
<html>
<head>
<title>Volunteer Contact</title>
</head>
<body>

<h2>Leave Contact Info</h2>

<form action="https://formspree.io/f/meeddkpn" method="POST">
    <!-- Correct redirect for your real domain -->
    <input type="hidden" name="_redirect" value="https://obrient1077-wq.github.io/Trustee-website/donation.html">

    <!-- Subject line for your email inbox -->
    <input type="hidden" name="_subject" value="Donation Information Request">

    <label>Your Name:</label>
    <input type="text" name="name" required>

    <label>Your Email:</label>
    <input type="email" name="email" required>

    <label>Your Phone (optional):</label>
    <input type="text" name="phone">

    <label>Your Message (optional):</label>
    <textarea name="message" rows="5"></textarea>

    <button type="submit">Request Donation Information</button>
</form>

</body>
</html>
