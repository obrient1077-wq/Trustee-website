<title>Volunteer Contact</title>
</head>
<body>

<h2>Leave Contact Info</h2>

<form action="https://formspree.io/f/xaqkkjlb" method="POST">

    <input type="hidden" name="_redirect" value="https://obrient1077-wq.github.io/Trustee-website/canvas.html">

    <!-- Subject line for your email inbox -->
